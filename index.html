<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to top, #87CEEB, #ffffff); /* mavi göy + ağ üfüq */
            overflow: hidden;
        }

        /* Günəş */
        .sun {
            position: absolute;
            top: 10%;
            left: 80%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #FFD700, #FFA500);
            border-radius: 50%;
            box-shadow: 0 0 50px #FFD700;
            animation: rotateSun 20s linear infinite;
        }

        @keyframes rotateSun {
            from {transform: rotate(0deg);}
            to {transform: rotate(360deg);}
        }

        /* Buludlar */
        .cloud {
            position: absolute;
            background: #fff;
            background: radial-gradient(#fff 50%, transparent 50%);
            width: 120px;
            height: 60px;
            border-radius: 50%;
            top: 20%;
            left: 10%;
            animation: moveCloud 60s linear infinite;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: #fff;
            width: 80px;
            height: 80px;
            position: absolute;
            border-radius: 50%;
        }

        .cloud::before {
            top: -30px;
            left: 10px;
        }

        .cloud::after {
            top: -20px;
            left: 40px;
        }

        @keyframes moveCloud {
            0% {left: -150px;}
            100% {left: 110%;}
        }

        /* Container */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        input {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            outline: none;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            margin-left: 10px;
            cursor: pointer;
            background-color: #FFD700;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }
#result {
    display: none; /* default gizli */
    margin-top: 20px;
    font-size: 18px;
    color: #000; /* yazı qara oldu */
    text-shadow: 1px 1px 2px rgba(255,255,255,0.5); /* oxunması üçün yumşaq kölgə */
    background: linear-gradient(135deg, rgba(76, 215, 228, 0.9), rgba(255, 255, 150, 0.9)); /* açıq sarı / pastel */
    padding: 15px 20px;
    border-radius: 15px;
    min-width: 250px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}



    </style>
</head>
<body>
    <div class="sun"></div>
    <div class="cloud"></div>

    <div class="container">
        <h1>Weather App</h1>
        <div>
            <input type="text" id="city" placeholder="Şəhər adı daxil edin">
            <button onclick="getWeather()">Göstər</button>
        </div>
        <div id="result"></div>
    </div>


    <script>
        function getWeather() {
    const city = document.getElementById('city').value.trim();
    const resultDiv = document.getElementById('result');

    if (!city) {  
        resultDiv.style.display = "none"; // boş inputda div gizlənir
        return;
    }

    fetch(`http://localhost:8080/weather?city=${city}`)
        .then(response => response.json())
        .then(data => {
            const loc = data.location;
            const current = data.current;
            resultDiv.style.display = "inline-block"; // cavab gəldikdə göstər
            resultDiv.innerHTML = `
                Şəhər: ${loc.name} <br>
                Ölkə: ${loc.country} <br>
                Temperatur: ${current.temp_c}°C <br>
                Hava: ${current.condition.text} <br>
                Rütubət: ${current.humidity}%
            `;
        })
        .catch(err => {
            resultDiv.style.display = "inline-block";
            resultDiv.innerHTML = "Xəta baş verdi!";
            console.error(err);
        });
}
    </script>
</body>
</html>
